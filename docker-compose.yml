services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pywe
      POSTGRES_PASSWORD: pywe
      POSTGRES_DB: pywe_cms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pywe -d pywe_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://pywe:pywe@db:5432/pywe_cms
      DOCKER_ENV: "true"
      SECRET_KEY: docker-dev-only-change-me
      DEBUG: "true"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
